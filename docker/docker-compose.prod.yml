services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ../api
    restart: unless-stopped
    env_file: ../api/.env
    environment:
      APP_ENV: production
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build: ../api
    restart: unless-stopped
    env_file: ../api/.env
    environment:
      APP_ENV: production
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    command: ["python", "-m", "scripts.job_worker"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        - NEXT_PUBLIC_COURSEKIN_API_URL=${API_URL:-http://api:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
