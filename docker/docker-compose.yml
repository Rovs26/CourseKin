services:

  api:
    build: ../api
    container_name: reviewflow_api
    ports:
      - "8000:8000"
    volumes:
      - ../api:/app
      - reviewflow_db:/app/data
      - reviewflow_uploads:/app/uploads
    env_file:
      - ../api/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: ../api
    container_name: reviewflow_worker
    command: ["python", "-m", "scripts.job_worker"]
    volumes:
      - ../api:/app
      - reviewflow_db:/app/data
      - reviewflow_uploads:/app/uploads
    env_file:
      - ../api/.env
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    # Worker is a long-running poller with no HTTP server; the inherited
    # /health check from the api image would never pass, so disable it.
    healthcheck:
      disable: true

volumes:
  reviewflow_db:
  reviewflow_uploads:
