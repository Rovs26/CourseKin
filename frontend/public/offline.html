<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — CourseKin</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f5ef;
        color: #202722;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #161a17; color: #f0ebe2; }
        .card { background: #1d221e; border-color: #343c35; }
        .muted { color: #aba89f; }
      }
      .card {
        max-width: 28rem;
        margin: 1.5rem;
        padding: 2rem;
        border: 1px solid #ded8cc;
        border-radius: 1.5rem;
        background: #fffdf8;
        text-align: center;
        box-shadow: 0 8px 30px -12px rgba(15, 23, 42, 0.18);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .muted { color: #626b62; margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #27604b;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
      }
      button:hover { background: #1e4b3a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p class="muted">
        CourseKin needs a connection to load your courses. Reconnect and try
        again — your study progress is safely synced.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
